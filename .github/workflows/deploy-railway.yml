name: Deploy ERP-Demo to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is missing. Add it in GitHub repo secrets, then re-run."
            exit 1
          fi
          railway up --ci --service "${RAILWAY_SERVICE:-}"
        # Optional repo secrets:
        #   RAILWAY_TOKEN   (required)
        #   RAILWAY_SERVICE (optional service name)
