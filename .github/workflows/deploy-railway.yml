name: Deploy ERP-Demo to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          # Project Token from Railway → Project → Settings → Tokens
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Optional override; default target is the ERP-Demo service only.
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is missing."
            exit 1
          fi
          export RAILWAY_TOKEN="$TOKEN"
          echo "RAILWAY_TOKEN length: ${#TOKEN}"

          # NEVER deploy this repo to the company ERP/ATLAS service.
          # Target is the customer trial sandbox only.
          SERVICE="${RAILWAY_SERVICE_ID:-ERP-Demo}"

          echo "Listing services:"
          railway service list || true

          echo "Deploying to service: $SERVICE (sandbox only — not ATLAS)"
          if ! railway up --ci --detach --service "$SERVICE"; then
            echo "railway up failed for service=$SERVICE"
            echo "If the name differs, set GitHub secret RAILWAY_SERVICE_ID"
            echo "to the service that serves https://erp-demo-production-9ab8.up.railway.app"
            exit 1
          fi
          echo "Deploy started for $SERVICE"
