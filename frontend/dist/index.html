<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>ERP Demo — IN Z Trial</title>
    <script>
      // Kill stale service workers / Cache Storage that pinned the old Platform login UI.
      (function () {
        try {
          if (!("serviceWorker" in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            });
          }
          // Install a one-shot cleaner SW as well.
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      /**
       * Public synth sandbox: always mint a local demo JWT when none exists
       * so inz.lol/demo iframe never shows a second login wall.
       */
      (function () {
        var TOKEN_KEY = "erp_access_token";
        var DEMO_EMAIL = "demo@erp.demo";
        var DEMO_PASSWORD = "demo-erp-2026";
        var BOOT_FLAG = "erp_demo_boot_v3";

        function hasToken() {
          try {
            return Boolean(localStorage.getItem(TOKEN_KEY));
          } catch (e) {
            return false;
          }
        }

        function saveToken(token) {
          try {
            localStorage.setItem(TOKEN_KEY, token);
          } catch (e) {}
        }

        function postJson(url, body) {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", url, false);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.send(JSON.stringify(body));
          if (xhr.status < 200 || xhr.status >= 300) return null;
          try {
            return JSON.parse(xhr.responseText || "{}");
          } catch (e) {
            return null;
          }
        }

        try {
          var params = new URLSearchParams(window.location.search);
          var sso = params.get("inz_sso");
          if (sso) {
            var exchanged =
              postJson("/api/auth/inz-sso", { token: sso }) ||
              postJson("/api/auth/product-handoff", { token: sso });
            if (exchanged && exchanged.access_token) {
              saveToken(exchanged.access_token);
            }
          }
          if (!hasToken()) {
            var loggedIn = postJson("/api/stock/auth/login", {
              email: DEMO_EMAIL,
              password: DEMO_PASSWORD,
            });
            if (loggedIn && loggedIn.access_token) {
              saveToken(loggedIn.access_token);
            }
          }
          // One forced reload after first successful boot to drop any
          // previously-cached SPA modules from the old Platform login build.
          if (hasToken() && !sessionStorage.getItem(BOOT_FLAG)) {
            sessionStorage.setItem(BOOT_FLAG, "1");
            var clean =
              window.location.pathname +
              (window.location.search || "") +
              window.location.hash;
            window.location.replace(clean);
            return;
          }
        } catch (e) {}
      })();
    </script>
