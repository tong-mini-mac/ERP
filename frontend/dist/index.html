    <title>ERP Demo — IN Z Trial</title>
    <script>
      // Drop stale service workers/caches from older Platform-login builds.
      // Do not register a new SW (that caused navigate loops in the iframe).
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                r.unregister();
              });
            });
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            });
          }
        } catch (e) {}
      })();
    </script>
    <script>
      /**
       * Public synth sandbox: mint a local demo JWT when none exists so the
       * inz.lol/demo iframe never shows a second login wall.
       * No forced reload — that looped when storage was cleared.
       */
      (function () {
        var TOKEN_KEY = "erp_access_token";
        var DEMO_EMAIL = "demo@erp.demo";
        var DEMO_PASSWORD = "demo-erp-2026";

        function hasToken() {
          try {
            return Boolean(localStorage.getItem(TOKEN_KEY));
          } catch (e) {
            return false;
          }
        }

        function getToken() {
          try {
            return localStorage.getItem(TOKEN_KEY) || "";
          } catch (e) {
            return "";
          }
        }

        function saveToken(token) {
          try {
            localStorage.setItem(TOKEN_KEY, token);
          } catch (e) {}
        }

        function clearToken() {
          try {
            localStorage.removeItem(TOKEN_KEY);
          } catch (e) {}
        }

        function postJson(url, body) {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", url, false);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.send(JSON.stringify(body));
          if (xhr.status < 200 || xhr.status >= 300) return null;
          try {
            return JSON.parse(xhr.responseText || "{}");
          } catch (e) {
            return null;
          }
        }

        function tokenIsValid() {
          var token = getToken();
          if (!token) return false;
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "/api/stock/auth/me", false);
          xhr.setRequestHeader("Authorization", "Bearer " + token);
          xhr.send();
          return xhr.status >= 200 && xhr.status < 300;
        }

        function ensureDemoLogin() {
          var loggedIn = postJson("/api/stock/auth/login", {
            email: DEMO_EMAIL,
            password: DEMO_PASSWORD,
          });
          if (loggedIn && loggedIn.access_token) {
            saveToken(loggedIn.access_token);
          }
        }

        try {
          var params = new URLSearchParams(window.location.search);
          var sso = params.get("inz_sso");
          if (sso) {
            var exchanged =
              postJson("/api/auth/inz-sso", { token: sso }) ||
              postJson("/api/auth/product-handoff", { token: sso });
            if (exchanged && exchanged.access_token) {
              saveToken(exchanged.access_token);
            }
          }
          // Re-mint when missing OR stale (JWT secret / redeploy) so warehouse
          // and ingredients tabs do not show "Invalid token" / empty lists.
          if (!hasToken() || !tokenIsValid()) {
            clearToken();
            ensureDemoLogin();
          }
        } catch (e) {}
      })();
    </script>
