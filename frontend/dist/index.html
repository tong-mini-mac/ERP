<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>ERP Demo — IN Z Trial</title>
    <script>
      /**
       * ERP-Demo is a public synth-data sandbox.
       * Always enter with a local demo JWT when no session exists so
       * inz.lol/demo (iframe) never shows a second login wall.
       * Optional: ?inz_sso= platform handoff still preferred when present.
       * Never talks to ATLAS.
       */
      (function () {
        var TOKEN_KEY = "erp_access_token";
        var DEMO_EMAIL = "demo@erp.demo";
        var DEMO_PASSWORD = "demo-erp-2026";

        function hasToken() {
          try {
            return Boolean(localStorage.getItem(TOKEN_KEY));
          } catch (e) {
            return false;
          }
        }

        function saveToken(token) {
          try {
            localStorage.setItem(TOKEN_KEY, token);
          } catch (e) {}
        }

        function stripParams(names) {
          var params = new URLSearchParams(window.location.search);
          var changed = false;
          names.forEach(function (name) {
            if (params.has(name)) {
              params.delete(name);
              changed = true;
            }
          });
          if (!changed) return;
          var next =
            window.location.pathname +
            (params.toString() ? "?" + params.toString() : "") +
            window.location.hash;
          window.history.replaceState({}, "", next);
        }

        function postJson(url, body) {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", url, false);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.send(JSON.stringify(body));
          if (xhr.status < 200 || xhr.status >= 300) return null;
          try {
            return JSON.parse(xhr.responseText || "{}");
          } catch (e) {
            return null;
          }
        }

        try {
          var params = new URLSearchParams(window.location.search);
          var sso = params.get("inz_sso");

          if (sso) {
            var exchanged =
              postJson("/api/auth/inz-sso", { token: sso }) ||
              postJson("/api/auth/product-handoff", { token: sso });
            if (exchanged && exchanged.access_token) {
              saveToken(exchanged.access_token);
              stripParams(["inz_sso"]);
            }
          }

          if (!hasToken()) {
            var loggedIn = postJson("/api/stock/auth/login", {
              email: DEMO_EMAIL,
              password: DEMO_PASSWORD,
            });
            if (loggedIn && loggedIn.access_token) {
              saveToken(loggedIn.access_token);
            }
          }

          stripParams(["demo_auto"]);
        } catch (e) {
          // Fall through to SPA login UI only if bootstrap fails.
        }
      })();
    </script>
    <script
      type="module"
      crossorigin
      src="/assets/index-erpdemo-20260906171855.js"
    ></script>
    <link
      rel="stylesheet"
      crossorigin
      href="/assets/index-erpdemo-20260906171855.css"
    />
  </head>

    <div id="root"></div>
  </body>
</html>
